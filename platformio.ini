; PlatformIO 用設定（ESP-IDF フレームワーク）
; ESP-IDF の idf.py でもそのままビルドできます。
[platformio]
src_dir = main
default_envs = esp32s3

[env:esp32s3]
; ESP32-S3 N16R8（フラッシュ 16MB / オクタル PSRAM 8MB）
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB

[env:xiao]
; Seeed Studio XIAO ESP32S3（フラッシュ 8MB / オクタル PSRAM 8MB、状態表示は SSD1306 の OLED）
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions_8mb.csv
board_upload.flash_size = 8MB
; CMakeLists.txt でボードを選ぶ（sdkconfig.defaults.xiao が読まれ、プロジェクト名が headboard_led_xiao になる）
board_build.cmake_extra_args = -DHB_BOARD=xiao
