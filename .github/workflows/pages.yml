# main に push すると、web/ を GitHub Pages に公開する。
# ファームウェアは手元（tools/build.sh）で署名してコミットしたものを公開する（秘密鍵を GitHub に置かないため）。
# ここでは公開鍵で署名を確かめ、署名のないものや違う鍵のものは公開しない
name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.1
    steps:
      - uses: actions/checkout@v4
      - name: Verify firmware signature
        shell: bash
        run: |
          . "$IDF_PATH/export.sh" >/dev/null
          espsecure.py verify_signature --version 2 --keyfile keys/headboard-signing-pubkey.pem web/firmware/headboard-led-ota.bin
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
