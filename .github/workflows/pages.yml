# main に push するとファームウェアをビルドし、設定ページと一緒に GitHub Pages に公開する
name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.1
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware
        shell: bash
        run: bash tools/build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
